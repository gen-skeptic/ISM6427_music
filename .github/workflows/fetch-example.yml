# One-time helper: downloads the example song into public/examples/ and
# commits it. Removed again right after it runs.
name: Fetch example track
on:
  push:
    branches: [claude/upbeat-feynman-7xqgj1]
    paths: [.github/workflows/fetch-example.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download MP3
        run: |
          mkdir -p public/examples
          curl -fsSL --retry 3 -o public/examples/example.mp3 \
            "https://tempfile.aiquickdraw.com/r/9f675de1-775d-4be0-9a27-cdc3b426a1b4.mp3"
          file public/examples/example.mp3
          ls -l public/examples/example.mp3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/examples/example.mp3
          git commit -m "Add example track MP3"
          git push
